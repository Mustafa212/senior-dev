# Runs the script self-tests on Linux and Windows, and checks the plugin manifests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: heavy.sh self-tests
        shell: bash
        run: bash scripts/test/heavy_test.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json and marketplace.json parse and agree on the name
        run: |
          name=$(jq -er .name .claude-plugin/plugin.json)
          [ "$(jq -er '.plugins[0].name' .claude-plugin/marketplace.json)" = "$name" ]
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 2.1.308 or later reads a hooks module (the effort hook) and runs its tests.
      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code@2.1.310 plugin validate .
      - name: the effort hook's tests
        run: npx -y @anthropic-ai/claude-code@2.1.310 plugin test .
